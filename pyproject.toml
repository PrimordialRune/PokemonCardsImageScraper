[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ptcg-art-scraper"
version = "0.1.0"
description = "Pokémon card image scraper/downloader focused on pkmncards.com"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "typer>=0.9,<1",
    "httpx>=0.27,<1",
    "Pillow>=10,<12",
    "beautifulsoup4>=4.12,<5",
    "rich>=13,<14",
    "anyio>=4,<5",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-Pillow",
    "types-beautifulsoup4",
]

[project.scripts]
ptcg_art_scraper = "ptcg_art_scraper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ptcg_art_scraper"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: tests that require network access",
]
